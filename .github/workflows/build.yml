name: Build miner image

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # L'image CUDA devel fait ~6 Go, le runner est juste en espace disque
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" \
                      /usr/local/.ghcup /opt/hostedtoolcache
          sudo docker image prune -af || true
          df -h

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64
          push: true
          # GHCR exige un nom de repo en minuscules ("Volko61" est rejete)
          tags: ghcr.io/volko61/btc-miner:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
